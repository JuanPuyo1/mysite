<section class="px-6 py-8 lg:px-20 lg:py-16">
  <div class="mb-4 flex flex-col gap-2 lg:mb-6 lg:gap-2">
    <p class="text-xs font-medium uppercase tracking-[1px] text-muted lg:text-[13px] lg:tracking-[1.2px]">
      Git activity
    </p>
    <h2 class="font-display text-2xl font-bold text-ink lg:text-[28px] lg:tracking-[-0.6px]">
      <span class="lg:hidden">{{ contribution_total }} contributions</span>
      <span class="hidden lg:inline">{{ contribution_total }} contributions in the last year</span>
    </h2>
  </div>

  <div
    id="contributions-panel"
    hx-get="{% url 'contributions' %}"
    hx-trigger="load, every 60s"
    hx-swap="innerHTML"
  >
    {% include "core/partials/contributions_panel.html" %}
  </div>
</section>
