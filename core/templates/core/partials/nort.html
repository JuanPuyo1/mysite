<section id="nort" class="bg-bg px-6 py-8 lg:px-20 lg:py-16">
  <div class="card rounded-xl border border-line bg-surface shadow-none lg:p-8">
    <div class="card-body gap-3 p-0 lg:flex-row lg:items-center lg:justify-between lg:gap-12">
      <div class="flex flex-col gap-3 lg:gap-3">
        <p class="text-xs font-medium uppercase tracking-[1px] text-muted lg:text-[13px] lg:tracking-[1.2px]">
          Featured research
        </p>
        <h2 class="font-display text-4xl font-bold text-ink lg:text-[40px] lg:tracking-[-1px]">
          {{ nort.title }}
        </h2>
        <p class="text-base leading-6 text-muted lg:leading-[26px]">
          <span class="lg:hidden">{{ nort.description_mobile }}</span>
          <span class="hidden lg:inline">{{ nort.description }}</span>
        </p>
        <div class="hidden flex-wrap gap-2 pt-1 lg:flex">
          {% for tag in nort.tags %}
          <span class="badge badge-sm rounded-lg border-0 bg-accent-soft px-2.5 py-1.5 text-xs font-medium text-accent">
            {{ tag }}
          </span>
          {% endfor %}
        </div>
      </div>

      <a
        href="{{ nort.url }}"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary mt-2 w-full shrink-0 rounded-lg border-0 bg-accent px-[22px] py-3.5 text-sm font-medium normal-case text-white hover:bg-accent lg:mt-0 lg:w-auto"
      >
        Open NORT page →
      </a>
    </div>
  </div>
</section>
