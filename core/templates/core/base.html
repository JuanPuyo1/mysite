{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="esteban">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esteban Puyo</title>
  <meta name="description" content="Systems engineer exploring brain–computer interfaces.">
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  {% if google_analytics_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ google_analytics_id }}');
  </script>
  {% endif %}
  <script defer src="{% static 'vendor/gsap.min.js' %}"></script>
  <script defer src="{% static 'vendor/ScrollTrigger.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script defer src="{% static 'js/signal-field.js' %}"></script>
  <script defer src="{% static 'js/contributions.js' %}"></script>
  <script defer src="{% static 'js/main.js' %}"></script>
</head>
<body class="font-body bg-bg text-ink antialiased">
  {% block content %}{% endblock %}
</body>
</html>
