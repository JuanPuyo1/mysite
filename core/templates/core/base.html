{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="esteban">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esteban Puyo</title>
  <meta name="description" content="Systems engineer exploring brain–computer interfaces.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#f4f6f5",
            ink: "#141816",
            muted: "#5c6660",
            accent: "#1f6f78",
            "accent-soft": "#d7ebec",
            surface: "#ffffff",
            line: "#dce3df",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            body: ["IBM Plex Sans", "sans-serif"],
          },
          borderRadius: {
            xl: "12px",
          },
        },
      },
      daisyui: {
        themes: [
          {
            esteban: {
              primary: "#1f6f78",
              secondary: "#d7ebec",
              accent: "#4fa88a",
              neutral: "#141816",
              "base-100": "#ffffff",
              "base-200": "#f4f6f5",
              "base-300": "#dce3df",
              "base-content": "#141816",
            },
          },
        ],
      },
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script defer src="{% static 'js/signal-field.js' %}"></script>
  <script defer src="{% static 'js/contributions.js' %}"></script>
  <script defer src="{% static 'js/main.js' %}"></script>
</head>
<body class="font-body bg-bg text-ink antialiased">
  {% block content %}{% endblock %}
</body>
</html>
